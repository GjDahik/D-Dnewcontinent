<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ Nueva Valdoria - Personaje</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .player-hero { text-align: center; padding: 30px 20px; border-bottom: 2px solid #8b5a2b; margin-bottom: 20px; }
        .player-hero h1 { font-family: 'Cinzel', serif; color: #d4af37; font-size: 2em; margin-bottom: 8px; }
        .player-hero .sub { color: #8b7355; font-style: italic; }
        .player-card { background: linear-gradient(180deg, rgba(61, 42, 30, 0.95) 0%, rgba(42, 28, 20, 0.98) 100%); border: 2px solid #5c4023; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .player-card h3 { font-family: 'Cinzel', serif; color: #d4af37; margin-bottom: 15px; font-size: 1.2em; }
        .player-stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #5c4023; }
        .player-stat:last-child { border-bottom: none; }
        .player-stat-label { color: #a89878; }
        .player-stat-value { color: #d4c4a8; font-weight: 600; }
        .inventory-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(0,0,0,0.3); border-radius: 6px; margin-bottom: 8px; border: 1px solid #4a3c31; }
        .inventory-item:last-child { margin-bottom: 0; }
        .rarity-badge { padding: 2px 8px; border-radius: 10px; font-size: 0.75em; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container" id="player-app" style="display: none;">
        <header class="header">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <div>
                    <h1>🏰 Nueva Valdoria</h1>
                    <p>Tu Personaje</p>
                </div>
                <button class="btn btn-secondary btn-small" onclick="playerLogout()">🚪 Salir</button>
            </div>
        </header>

        <div class="player-hero">
            <h1 id="player-name">—</h1>
            <p class="sub" id="player-class-level">—</p>
        </div>

        <div class="player-card">
            <h3>💰 Oro</h3>
            <div class="player-stat">
                <span class="player-stat-label">Monedas (GP)</span>
                <span class="player-stat-value gold-value" id="player-oro">0</span>
            </div>
        </div>

        <div class="player-card">
            <h3>🎒 Inventario</h3>
            <div id="player-inventory-list">
                <p style="color:#8b7355; text-align:center; padding:20px;">Sin items</p>
            </div>
        </div>
    </div>

    <!-- Modal Login (solo personajes) -->
    <div class="modal-overlay active" id="player-login-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>⚔️ Iniciar Sesión - Personaje</h3>
            </div>
            <div class="modal-body">
                <p style="color: #8b7355; margin-bottom: 15px; font-size: 0.95em;">Ingresa el nombre de tu personaje y el PIN que te asignó el DM.</p>
                <div class="form-group">
                    <label>Nombre del Personaje</label>
                    <input type="text" id="player-login-nombre" placeholder="Ej: Big Mamma">
                </div>
                <div class="form-group">
                    <label>PIN</label>
                    <input type="password" id="player-login-pin" maxlength="10" placeholder="PIN asignado por el DM">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="playerLogin()">⚔️ Entrar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/player-app.js"></script>
</body>
</html>
